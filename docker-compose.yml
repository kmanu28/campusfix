# Local databases for development:  docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campusfix
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]
volumes:
  pgdata:
  mongodata:
